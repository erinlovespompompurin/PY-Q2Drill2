
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill2</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f7f4ee;
            font-family: cursive;
            color: #354638;
        }

        .container {
            max-width: 850px;
            margin-top: 50px;
            margin-bottom: 50px;
            background-color: #fffdf8;
            padding: 40px;
            border: 1px solid #e5dfd5;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-weight: bold;
            color: #354638;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #d6d3cc;
            border-radius: 9px;
        }

        .btn-danger {
            background-color: #bd5b53;
            border: none;
            padding: 12px 30px;
            border-radius: 9px;
            font-family: Arial, sans-serif;
            transition: 0.3s;
        }

        .btn-danger:hover {
            background-color: #a94c45;
        }

        #output1 {
            margin-top: 30px;
            padding: 25px;
            border: 1px solid #e5dfd5;
            border-radius: 15px;
            background-color: #eef0e9;
            font-family: Arial, sans-serif;
            line-height: 2;
            min-height: 100px;
            overflow-wrap: anywhere;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1>Add New Monarch Member:</h1>

                <form action="">
                    <input type="text" id="input1" placeholder="Enter First Name">
                    <input type="text" id="input2" placeholder="Enter Surname">
                    <button type="button" id="btn" class="btn btn-danger" py-click="add_member">Submit</button>
                </form>
        </div>
    </div>
    <div class="row">
        <div class="col-12" id="output1">
             Your member list will appear here.
        </div>
    </div>
</div>

    <script type="py" src="main.py"></script>
</body>
</html>
